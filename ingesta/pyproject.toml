[project]
name = "ingesta"
version = "0.1.0"
description = "Ingesta diaria de normas oficiales y envío de alertas de la app legal peruana"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
