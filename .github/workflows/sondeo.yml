name: Sondeo (temporal)
on:
  push:
    branches: [fase-3-tribunales]
    paths: [".github/sondeo/**", ".github/workflows/sondeo.yml"]
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install httpx
      - run: python .github/sondeo/congreso.py
