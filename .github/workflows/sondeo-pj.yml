name: Sondeo PJ (temporal)
on:
  push:
    branches: [fase-2-jurisprudencia-pj]
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install httpx beautifulsoup4
      - run: >-
          python .github/sondeo/pj.py
          https://www.pj.gob.pe/wps/wcm/connect/cij-juris/s_cij_jurisprudencia_nuevo/as_jurisprudencia_sistematizada/as_acuerdos_plenarios/as_AcuerdosPlenariosenMateriaPenal/
          https://www.pj.gob.pe/wps/wcm/connect/cij-juris/s_cij_jurisprudencia_nuevo/as_jurisprudencia_sistematizada/as_ejecutorias_vinculantes/as_civil/
          https://www.pj.gob.pe/wps/wcm/connect/cij-juris/s_cij_jurisprudencia_nuevo/as_jurisprudencia_sistematizada/as_ejecutorias_vinculantes/as_penal/
          https://www.pj.gob.pe/wps/wcm/connect/cij-juris/s_cij_jurisprudencia_nuevo/as_jurisprudencia_sistematizada/as_ejecutorias_vinculantes/as_laboral/
          https://www.pj.gob.pe/wps/wcm/connect/cij-juris/s_cij_jurisprudencia_nuevo/as_jurisprudencia_sistematizada/as_acuerdos_plenarios/as_AcuerdosPlenariosenMateriaLaboral/
          https://www.pj.gob.pe/wps/wcm/connect/cij-juris/s_cij_jurisprudencia_nuevo/as_jurisprudencia_sistematizada/as_boletin_jurisprudencial/
          https://www.pj.gob.pe/wps/wcm/connect/cij-juris/s_jurisprudencia_sistematizada/as_suprema/as_cij-juris_resol_nlpt/
