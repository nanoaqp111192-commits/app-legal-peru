name: Supabase (esquema y modelos)

# Aplica las migraciones pendientes a la base de datos y carga los modelos de escritos.
# Necesita los secretos SUPABASE_DB_URL (cadena "Session pooler"), SUPABASE_URL y
# SUPABASE_SERVICE_ROLE_KEY. Las migraciones ya aplicadas no se repiten.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "contenido/modelos/**"
      - ".github/workflows/supabase.yml"

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  esquema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Comprobar secretos
        id: secretos
        # Los secretos entran solo a este paso; los siguientes reciben los valores ya limpios.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Con SUPABASE_DB_PASSWORD basta la contraseña: la cadena del Session pooler se arma
          # aquí probando las regiones, porque la región no figura en la URL del proyecto.
          if [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$SUPABASE_URL" ]; then
            ref="$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]' | sed -E 's#^https?://([^.]+)\.supabase\.co.*#\1#')"
            clave="$(printf '%s' "$SUPABASE_DB_PASSWORD" | tr -d '\r\n' | python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.stdin.read(),safe=""))')"
            echo "::add-mask::$clave"
            SUPABASE_DB_URL=""
            for pre in aws-0 aws-1; do
              for region in us-east-1 us-east-2 us-west-1 us-west-2 sa-east-1 ca-central-1 eu-west-1 eu-west-2 eu-west-3 eu-central-1 eu-central-2 eu-north-1 ap-south-1 ap-southeast-1 ap-southeast-2 ap-northeast-1 ap-northeast-2; do
                url="postgresql://postgres.$ref:$clave@$pre-$region.pooler.supabase.com:5432/postgres"
                if PGCONNECT_TIMEOUT=8 psql "$url" -Atqc 'select 1' >/dev/null 2>&1; then
                  SUPABASE_DB_URL="$url"; echo "Base encontrada en $pre-$region."; break 2
                fi
              done
            done
            [ -n "$SUPABASE_DB_URL" ] || { echo "::error::Con SUPABASE_DB_PASSWORD no se pudo entrar a la base: revisa que la contraseña sea la de Project Settings → Database."; exit 1; }
          fi
          faltan=()
          for s in SUPABASE_DB_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            [ -n "${!s}" ] || faltan+=("$s")
          done
          if [ ${#faltan[@]} -gt 0 ]; then
            echo "::warning::Faltan los secretos: ${faltan[*]}. No se aplicó nada."
            echo "listo=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Quita espacios y saltos de línea que suelen colarse al pegar.
          for s in SUPABASE_DB_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            v="$(printf '%s' "${!s}" | tr -d '[:space:]')"
            v="${v#[\"\']}"; v="${v%[\"\']}"
            [ "$s" = SUPABASE_URL ] && v="${v%/}"
            echo "::add-mask::$v"
            echo "$s=$v" >> "$GITHUB_ENV"
            declare "$s=$v"
          done
          # Al pegar desde un chat la cadena a veces llega como enlace: [postgresql://...](mailto:...).
          if [[ "$SUPABASE_DB_URL" =~ ^\[(postgres(ql)?://[^]]+)\]\(.*\)$ ]]; then
            SUPABASE_DB_URL="${BASH_REMATCH[1]}"
            echo "::add-mask::$SUPABASE_DB_URL"
            echo "SUPABASE_DB_URL=$SUPABASE_DB_URL" >> "$GITHUB_ENV"
            echo "::notice::SUPABASE_DB_URL venía pegada como enlace; se usó solo la cadena."
          fi
          # Revisa la forma de cada secreto sin mostrar su valor.
          primero="${SUPABASE_DB_URL:0:1}"
          [[ "$primero" =~ [A-Za-z0-9] ]] || echo "SUPABASE_DB_URL empieza con el signo '$primero' y mide ${#SUPABASE_DB_URL} caracteres."
          errores=()
          case "$SUPABASE_DB_URL" in
            postgresql://*@*|postgres://*@*) ;;
            *) errores+=("SUPABASE_DB_URL debe empezar con postgresql:// (cadena 'Session pooler' de Connect).") ;;
          esac
          case "$SUPABASE_DB_URL" in
            *YOUR-PASSWORD*|*\[*|*\]*) errores+=("SUPABASE_DB_URL aún tiene [YOUR-PASSWORD] o corchetes: reemplázalo por la contraseña, sin corchetes.") ;;
          esac
          resto="${SUPABASE_DB_URL#*://}"
          [ "$(printf '%s' "$resto" | tr -cd '@' | wc -c)" -le 1 ] || errores+=("La contraseña de SUPABASE_DB_URL contiene '@': cámbiala en Supabase por una sin símbolos.")
          host="${resto##*@}"; host="${host%%/*}"; host="${host%%:*}"
          case "$host" in
            *.pooler.supabase.com) ;;
            *) errores+=("SUPABASE_DB_URL apunta a '${host:-vacío}': usa la cadena 'Session pooler', que termina en pooler.supabase.com.") ;;
          esac
          case "$SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) errores+=("SUPABASE_URL debe ser https://<proyecto>.supabase.co, sin nada al final.") ;;
          esac
          case "$SUPABASE_SERVICE_ROLE_KEY" in
            sb_secret_*|eyJ*) ;;
            sb_publishable_*) errores+=("SUPABASE_SERVICE_ROLE_KEY tiene la clave pública: debe ser la secreta (sb_secret_...).") ;;
            *) errores+=("SUPABASE_SERVICE_ROLE_KEY no parece una clave de Supabase (sb_secret_...).") ;;
          esac
          if [ ${#errores[@]} -gt 0 ]; then
            for e in "${errores[@]}"; do echo "::error::$e"; done
            exit 1
          fi
          echo "Secretos con forma correcta (base: $host)."
          echo "listo=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.secretos.outputs.listo == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.secretos.outputs.listo == 'true'
        with:
          version: latest
      - name: Aplicar migraciones
        if: steps.secretos.outputs.listo == 'true'
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all
      - uses: actions/setup-python@v5
        if: steps.secretos.outputs.listo == 'true'
        with:
          python-version: "3.13"
      - name: Cargar los modelos de escritos
        if: steps.secretos.outputs.listo == 'true'
        working-directory: ingesta
        run: |
          pip install -e .
          python -m ingesta modelos
