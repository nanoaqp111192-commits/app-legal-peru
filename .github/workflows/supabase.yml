name: Supabase (esquema y modelos)

# Aplica las migraciones pendientes a la base de datos y carga los modelos de escritos.
# Necesita los secretos SUPABASE_DB_URL (cadena "Session pooler"), SUPABASE_URL y
# SUPABASE_SERVICE_ROLE_KEY. Las migraciones ya aplicadas no se repiten.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "contenido/modelos/**"
      - ".github/workflows/supabase.yml"

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  esquema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Comprobar secretos
        id: secretos
        run: |
          faltan=()
          for s in SUPABASE_DB_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            [ -n "${!s}" ] || faltan+=("$s")
          done
          if [ ${#faltan[@]} -gt 0 ]; then
            echo "::warning::Faltan los secretos: ${faltan[*]}. No se aplicó nada."
            echo "listo=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Quita espacios y saltos de línea que suelen colarse al pegar.
          for s in SUPABASE_DB_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            v="$(printf '%s' "${!s}" | tr -d '[:space:]')"
            [ "$s" = SUPABASE_URL ] && v="${v%/}"
            echo "::add-mask::$v"
            echo "$s=$v" >> "$GITHUB_ENV"
            declare "$s=$v"
          done
          # Revisa la forma de cada secreto sin mostrar su valor.
          errores=()
          case "$SUPABASE_DB_URL" in
            postgresql://*@*|postgres://*@*) ;;
            *) errores+=("SUPABASE_DB_URL debe empezar con postgresql:// (cadena 'Session pooler' de Connect).") ;;
          esac
          case "$SUPABASE_DB_URL" in
            *YOUR-PASSWORD*|*\[*|*\]*) errores+=("SUPABASE_DB_URL aún tiene [YOUR-PASSWORD] o corchetes: reemplázalo por la contraseña, sin corchetes.") ;;
          esac
          resto="${SUPABASE_DB_URL#*://}"
          [ "$(printf '%s' "$resto" | tr -cd '@' | wc -c)" -le 1 ] || errores+=("La contraseña de SUPABASE_DB_URL contiene '@': cámbiala en Supabase por una sin símbolos.")
          host="${resto##*@}"; host="${host%%/*}"; host="${host%%:*}"
          case "$host" in
            *.pooler.supabase.com) ;;
            *) errores+=("SUPABASE_DB_URL apunta a '${host:-vacío}': usa la cadena 'Session pooler', que termina en pooler.supabase.com.") ;;
          esac
          case "$SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) errores+=("SUPABASE_URL debe ser https://<proyecto>.supabase.co, sin nada al final.") ;;
          esac
          case "$SUPABASE_SERVICE_ROLE_KEY" in
            sb_secret_*|eyJ*) ;;
            sb_publishable_*) errores+=("SUPABASE_SERVICE_ROLE_KEY tiene la clave pública: debe ser la secreta (sb_secret_...).") ;;
            *) errores+=("SUPABASE_SERVICE_ROLE_KEY no parece una clave de Supabase (sb_secret_...).") ;;
          esac
          if [ ${#errores[@]} -gt 0 ]; then
            for e in "${errores[@]}"; do echo "::error::$e"; done
            exit 1
          fi
          echo "Secretos con forma correcta (base: $host)."
          echo "listo=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.secretos.outputs.listo == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.secretos.outputs.listo == 'true'
        with:
          version: latest
      - name: Aplicar migraciones
        if: steps.secretos.outputs.listo == 'true'
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all
      - uses: actions/setup-python@v5
        if: steps.secretos.outputs.listo == 'true'
        with:
          python-version: "3.13"
      - name: Cargar los modelos de escritos
        if: steps.secretos.outputs.listo == 'true'
        working-directory: ingesta
        run: |
          pip install -e .
          python -m ingesta modelos
