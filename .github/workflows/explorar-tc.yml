# Temporal: ver el HTML real del TC (la red del entorno de desarrollo no llega a tc.gob.pe).
name: explorar-tc
on:
  push:
    branches: [fase-2-jurisprudencia-tc]
jobs:
  html:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="AppLegalPeru-ingesta/0.1 (+https://github.com/nanoaqp111192-commits/app-legal-peru)"
          mostrar() { echo "=== $1"; curl -sSL -A "$UA" -w "\n=== HTTP %{http_code} %{content_type}\n" "$1" | tr -s ' \t' | grep -v '^\s*$' | head -c "$2"; echo; }
          mostrar https://www.tc.gob.pe/robots.txt 3000
          curl -sSL -A "$UA" https://www.tc.gob.pe/resolucion/publicadas-en-el-dia/ -o dia.html
          echo "=== bytes $(wc -c < dia.html)"
          python3 - <<'PY'
          s = open("dia.html", encoding="utf-8", errors="replace").read()
          i = s.find("Últimas Resoluciones")
          print(s[i - 3000 : i + 9000])
          j = s.find("autosdecretos", i + 9000)
          print("=== AUTOS", s[j - 500 : j + 4000] if j > 0 else "no")
          PY
          mostrar "https://www.tc.gob.pe/consultas-de-causas/detalles-consulta?id_exp=499044" 200000 > det.txt; python3 -c "
          s=open('det.txt').read(); i=s.find('Datos del Expediente'); print(s[i-500:i+6000])"
          mostrar https://www.tc.gob.pe/jurisprudencia/2026/05853-2025-AA.html 12000
