name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ingesta:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingesta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - name: Modelos de escritos válidos
        run: python -m ingesta modelos --validar

  base-de-datos:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar migraciones y pruebas sobre un PostgreSQL limpio
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/pruebas/supabase_stub.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql -v ON_ERROR_STOP=1 -f supabase/pruebas/prueba_esquema.sql

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/app/package-lock.json
      - run: npm ci
      - run: npm run modelos -- --comprobar
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run export:web
      # Con credenciales la app usa otro camino (cliente de Supabase); debe exportar igual.
      - name: Exportar web con servidor configurado
        run: npx expo export -p web --output-dir /tmp/dist-con-servidor
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: clave-de-prueba

  # Lee el listado real de El Peruano sin guardar nada. No bloquea el PR (depende de un
  # sitio externo), pero avisa si la fuente cambió de formato.
  fuente-el-peruano:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: ingesta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: python -m ingesta diaria --seco

  # Igual que la anterior, para el Tribunal Constitucional: lee el listado del
  # último día y completa 2 resoluciones (el TC pide 30 s entre pedidos).
  fuente-tc:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: ingesta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: python -m ingesta tc --seco
