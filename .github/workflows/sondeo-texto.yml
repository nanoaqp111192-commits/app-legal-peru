name: sondeo-texto
on:
  push:
    branches: [sondeo-texto]
permissions:
  contents: write
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mkdir -p out && cd out
          U=https://oqzkvtvvctiekodcxgfg.supabase.co/rest/v1
          K=sb_publishable_GAGFqluWty9vaopysXjoyw_UmHqeGkz
          g() { curl -s -H "apikey: $K" "$U/$1"; }
          g "normas?select=*&fecha_publicacion=eq.2026-10-08&order=id" > normas-dia.json
          g "normas?select=*&texto=not.is.null&order=id.desc&limit=5" > normas-texto.json
          g "normas?select=*&clave=not.is.null&tipo=ilike.*LEY*&order=id.desc&limit=5" > normas-ley.json
          g "compilados?select=*&order=titulo" > compilados.json
          g "afectaciones?select=*&limit=200" > afectaciones.json
          ls -la
          curl -sL -A "Mozilla/5.0" "$(jq -r '.[0].url_oficial' normas-texto.json)" -o ficha.html
          for y in 2024 2023 2022 2021 2020 2019 2018 2017 2016 2015 2014 2013 2012 2011 2010 2008 2005 2002 2000; do
            d=15/06/$y
            curl -s -A "Mozilla/5.0" -X POST https://diariooficial.elperuano.pe/Normas/Filtro -d "cddesde=$d&cdhasta=$d&X-Requested-With=XMLHttpRequest" -o l.html
            echo "$d disp=$(grep -oE 'dispositivo/[A-Z]+/[0-9]+-[0-9]+' l.html | sort -u | wc -l) nl=$(grep -oE 'normaslegales/[^\"]+-[0-9]+-[0-9]+/\"' l.html | sort -u | wc -l) portada=$(grep -oE 'NormasElperuano/Portada/[^\"]+' l.html | sort -u | wc -l) fechas=$(grep -c 'Fecha:' l.html) bytes=$(wc -c < l.html)" >> antiguedad.txt
          done
          rm -f l.html
          cat antiguedad.txt
          curl -sL -A "Mozilla/5.0" "https://busquedas.elperuano.pe/normaslegales/aceptan-renuncia-de-fiscal-adjunto-provincial-penal-de-chucu-resolucion-n-115-2019-mp-fn-jfs-1842040-1/" -o ficha_nl.html
          curl -sL -A "Mozilla/5.0" "https://busquedas.elperuano.pe/dispositivo/NL/1842040-1" -o ficha_disp_vieja.html
          curl -sL -A "Mozilla/5.0" "https://elperuano.pe/NormasElperuano/Portada/2012/01/03/735796-1.html" -o portada_2012.html
          ls -la ficha_* portada_*
      - run: |
          npm i -g playwright@1.56.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > cap.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const B = 'https://app-legal-peru.nanoaqp111192.workers.dev';
          const ids = JSON.parse(require('fs').readFileSync('out/normas-texto.json'));
          JS
          cat > cap.cjs <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const B = 'https://app-legal-peru.nanoaqp111192.workers.dev';
            const id = JSON.parse(require('fs').readFileSync('out/normas-texto.json'))[0].id;
            for (const [n, w, h, c] of [['escritorio', 1440, 900, 'light'], ['movil', 390, 844, 'light'], ['oscuro_movil', 390, 844, 'dark'], ['oscuro_escritorio', 1440, 900, 'dark']]) {
              const p = await b.newPage({ viewport: { width: w, height: h }, colorScheme: c });
              p.on('pageerror', (e) => console.log('ERROR', n, e.message));
              for (const r of ['/', '/buscar', `/norma/${id}`, '/plazos', '/modelos', '/alertas']) {
                await p.goto(B + r, { waitUntil: 'networkidle' }); await p.waitForTimeout(1500);
                await p.screenshot({ path: `out/${n}${r.replaceAll('/', '_')}.png` });
              }
            }
            await b.close();
          })();
          JS
          NODE_PATH=$(npm root -g) node cap.cjs
      - run: |
          git config user.name sondeo && git config user.email sondeo@users.noreply.github.com
          git add -f out && git commit -qm "Resultados del sondeo [skip ci]" && git push
